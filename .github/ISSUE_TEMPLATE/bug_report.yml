name: "🐞 Reportar un error"
description: "Algo no funciona como debería"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. No incluyas datos personales, tokens ni capturas con información privada.
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: ¿Qué ocurrió?
      placeholder: "Al girar la botella en modo retos..."
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir la app
        2. Elegir Amigos → Amigos 🔥
        3. Girar
        4. Ver el error
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y navegador
      placeholder: "iPhone 13, Safari 18 / Android, Chrome 130"
    validations:
      required: true
  - type: dropdown
    id: instalacion
    attributes:
      label: ¿Cómo estás usando la app?
      options:
        - Instalada en el celular
        - Navegador en el celular
        - Navegador en escritorio
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Información adicional
      description: Capturas, mensajes de consola o contexto.
    validations:
      required: false
