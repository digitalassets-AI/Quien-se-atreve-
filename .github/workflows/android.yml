name: Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName del APK (ej. 1.1.0)"
        required: false
        default: "1.1.0"
      version_code:
        description: "versionCode entero, debe ser mayor que el anterior"
        required: false
        default: "10100"

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#${PATCH:-0}))
          else
            VERSION_NAME="${INPUT_VERSION_NAME}"
            VERSION_CODE="${INPUT_VERSION_CODE}"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Versión del APK: $VERSION_NAME ($VERSION_CODE)"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate Android icons and splash
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
          python3 tools/make_android_assets.py
          cp -R android-assets/. android/app/src/main/res/

      - name: Prepare Android project
        env:
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/prepare_android.py

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto ANDROID_KEYSTORE_BASE64." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.p12
          chmod 600 android/app/release-key.p12

      - name: Build signed APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          grep -q "CN=Digital Assets" /tmp/apk-certs.txt
          "$AAPT" dump badging "$APK" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion):" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.digitalassets.quienseatreve'" /tmp/apk-badging.txt
          cp "$APK" "quien-se-atreve-v${VERSION_NAME}.apk"
          echo "file=quien-se-atreve-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quien-se-atreve-apk
          path: quien-se-atreve-v*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "¿Quién se atreve? ${{ steps.version.outputs.name }}"
          body: |
            ## 📲 APK para Android

            Descarga el archivo, ábrelo en tu teléfono y permite la instalación
            desde esta fuente si Android lo solicita.

            - Requiere **Android 6.0 o superior**.
            - Funciona **sin conexión** después de instalarlo.
            - No es un acceso directo al navegador: el contenido viaja dentro
              del APK.
            - Las actualizaciones se instalan encima de la versión anterior y
              conservan jugadores e historial.

            **Hecho por Digital Assets.** Digital Assets no se responsabiliza
            de nada de lo que ocurra antes, durante o después del juego.
          files: quien-se-atreve-v${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
