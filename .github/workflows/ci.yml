name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Rebuild database and app
        run: python3 tools/build.py

      - name: Verify database and PWA assets
        run: python3 tools/verify.py

      - name: Verify final content
        run: node tools/verify.js

      - name: Check generated HTML is committed
        run: git diff --exit-code -- app
